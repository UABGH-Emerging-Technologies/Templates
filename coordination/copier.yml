_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: ".jinja"
_answers_file: .copier-answers.coordination.yml

# NOTE: if combining with the common template, apply coordination AFTER
# common — both emit AGENTS.md, and this one includes common's rules-index
# block plus the board conventions. Applying common second would silently
# drop the board section.

project_name:
  type: str
  help: Your project name
  default: "{{ project_name | default('MyProject') }}"

github_owner:
  type: str
  help: "GitHub org or user that owns this repo (the project board is created under it)"
  default: "{{ github_owner | default('UABPeriopAI') }}"

# Stakeholder names are deliberately NOT a copier question: the board-setup
# procedure asks for them interactively when it creates the Responsible field
# (they can't be rendered into anything useful at stamp time).

# Board number and field/option IDs are deliberately NOT copier questions:
# the board does not exist at stamp time. The stamped files carry literal
# <BOARD_NUMBER>-style tokens that the board-setup procedure fills after it
# creates the board.
